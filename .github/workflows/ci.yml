name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-13

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-13
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DHFT_BUILD_TESTS=ON
          -DHFT_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

# There is deliberately no formatting job. `.clang-format` is kept as a hint for editors that
# want one, but nothing enforces it: the layout in this repository is chosen for readability by
# the person maintaining it, and a formatter that reflows it into something harder to read is
# costing more than the consistency is worth. CI gates what can actually break — the build and
# the tests.
