name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++-13

      - name: Configure
        run: >
          cmake -S . -B build -G Ninja
          -DCMAKE_CXX_COMPILER=g++-13
          -DCMAKE_BUILD_TYPE=RelWithDebInfo
          -DHFT_BUILD_TESTS=ON
          -DHFT_BUILD_BENCHMARKS=ON

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      # Pinned via pip so the formatter is byte-identical everywhere (CI and local).
      # Keep this version in sync with the formatter used locally.
      - name: Install pinned clang-format
        run: pip install "clang-format==22.1.5"
      - name: Check formatting
        run: |
          find libs apps tools tests benchmarks \( -name '*.hpp' -o -name '*.cpp' \) -print0 \
            | xargs -0 clang-format --dry-run --Werror
